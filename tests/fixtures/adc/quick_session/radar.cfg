% 1843_SAR_2ms_fmt1.cfg: copy of firmware_dev/projects/iwr1843_sar_lvds/configs/sar_example_2ms.cfg with lvdsStreamCfg dataFmt 1.
% Check: uv run python tools/sar_cfg_check.py configs/sar_example_2ms.cfg --max-range 100 --speed 0.75 --dmax 0.00711
% 1TX/1RX, 77.25 GHz start, 2.2 Msps complex x 3300 samples (1500 us window), Tc 2000 us, 255 chirps, Tb 300 us.
% Send after power-up (or after sensorStop + flushCfg). channelCfg/adcCfg/lowPower only on the first start.
sensorStop
flushCfg
dfeDataOutputMode 1
channelCfg 1 1 0
adcCfg 2 1
adcbufCfg -1 0 1 1 1
lowPower 0 0
% profileId startGHz idle adcStart rampEnd txPwr txPhase slope txStart Ns rate_ksps hpf1 hpf2 rxGain
%   slope 2.333 -> code 48 = 2.3174 MHz/us; hpf1 0 = 175 kHz, hpf2 0 = 350 kHz; gain 30 dB = tuning start point
profileCfg 0 77.25 480 10 1520 0 0 2.333 1 3300 2200 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
% startIdx endIdx loops numFrames(0=run until sensorStop) framePeriod_ms triggerSelect(1=software) triggerDelay
% period 510.3 ms = 255 x 2.000 ms + 300 us blank
frameCfg 0 0 255 0 510.3 1 0
% saturation monitor over the ADC window: 64 primary slices x 146 x 0.16 us = 1495 us
analogMonitor 1 0
CQRxSatMonitor 0 3 146 127 0
% calibData is required by sensorStart even when unused (0 0 0 = no save, no restore)
calibData 0 0 0
% dataFmt 1: plain ADC (driver frame = Nc chirps); dataFmt 2 metadata is not yet supported by the driver
lvdsStreamCfg -1 0 1 0
sensorStart
